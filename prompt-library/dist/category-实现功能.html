<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="按工作场景浏览和复制中文提示词。">
  <title>实现功能 · 日常提示词库</title>
  <link rel="stylesheet" href="./site.css">
  <script src="./copy.js" defer></script>
</head>
<body>
  <main class="container">
  <a class="back" href="./index.html">返回类别</a>
  <header class="intro">
    <h1>实现功能</h1>
    <p>3 条提示词</p>
  </header>
  <article class="prompt">
  <div class="prompt-level">基础 · 单轮</div>
  <h2>按验收条件完成一处小改动</h2>
  <p>适合范围清楚、可独立验证的小需求。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：按验收条件完成一处小改动">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制：按验收条件完成一处小改动">复制</button>
  </div>
  <template>
    <pre class="prompt-body" data-full-prompt>工作目录或仓库：[路径]。目标：[行为]。验收：[列表]。范围：[模块、明确保留项]。我已授权实现此范围。

先检查相关规则、入口和现有测试，复用可用逻辑。若仓库事实与需求冲突，带证据说明后再决定。完成最小改动，运行覆盖需求的现有检查。交付按“行为、改动位置、实际验证、剩余限制”汇报。</pre>
    
  </template>
</article>
<article class="prompt">
  <div class="prompt-level">进阶 · 多轮</div>
  <h2>先做一条最薄的可用路径</h2>
  <p>按小批交付推进需要跨数个模块的功能。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：先做一条最薄的可用路径">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制全套：先做一条最薄的可用路径">复制全套</button>
  </div>
  <template>
    <pre data-full-prompt hidden>### 第 1 轮 · 划切片

目标：[要求]。先查看现有入口和依赖，提出一个能让使用者端到端体验的小切片。写清边界和验收证据，等待我确认。

### 第 2 轮 · 实现首个切片

确认的切片和边界：[填写]。本轮只实施这部分。按现有项目约定实现并运行入口到产物的验证。记录仍需后续处理的范围。

### 第 3 轮 · 对齐下一步

根据首个切片的代码、测试和我的反馈：[填写]，指出哪些假设被改变。提出下一个最小切片，明确怎样证明它新增的价值。</pre><section class="prompt-round">
      <div class="round-header">
        <h3>第 1 轮 · 划切片</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 1 轮 · 划切片">复制本轮</button>
      </div>
      <pre class="prompt-body">目标：[要求]。先查看现有入口和依赖，提出一个能让使用者端到端体验的小切片。写清边界和验收证据，等待我确认。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 2 轮 · 实现首个切片</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 2 轮 · 实现首个切片">复制本轮</button>
      </div>
      <pre class="prompt-body">确认的切片和边界：[填写]。本轮只实施这部分。按现有项目约定实现并运行入口到产物的验证。记录仍需后续处理的范围。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 3 轮 · 对齐下一步</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 3 轮 · 对齐下一步">复制本轮</button>
      </div>
      <pre class="prompt-body">根据首个切片的代码、测试和我的反馈：[填写]，指出哪些假设被改变。提出下一个最小切片，明确怎样证明它新增的价值。</pre>
    </section>
    
  </template>
</article>
<article class="prompt">
  <div class="prompt-level">高阶 · 综合运用</div>
  <h2>带兼容性约束实现功能</h2>
  <p>适合需保留旧数据、客户端或失败恢复行为的修改。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：带兼容性约束实现功能">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制：带兼容性约束实现功能">复制</button>
  </div>
  <template>
    <pre class="prompt-body" data-full-prompt>需求和验收：[填写]。必须保留的调用路径、历史数据或接口：[填写]。我授权范围：[填写]。

根据真实调用点整理行为清单，给变更前后各举一个示例。找出需要共享逻辑的真实位置。先验证一条旧数据或旧客户端路径，再做最小实现。对已存在的重试或失败路径验证状态一致性。最终交付逐条关联“验收、实现位置、测试结果”，将尚需选择的行为保留为决策项。</pre>
    
  </template>
</article>
</main>
<dialog class="detail-dialog" aria-labelledby="detail-title">
  <div class="detail-panel">
    <header class="detail-header">
      <h2 id="detail-title"></h2>
      <form method="dialog"><button class="button" type="submit" autofocus>关闭</button></form>
    </header>
    <div class="detail-content"></div>
    <footer class="detail-footer">
      <p class="detail-status" role="status"></p>
      <button class="button copy" type="button" data-copy>复制提示词</button>
    </footer>
  </div>
</dialog>
<div class="toast" role="status"></div>
</body>
</html>
