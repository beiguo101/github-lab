<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="按工作场景浏览和复制中文提示词。">
  <title>运行观察与性能 · 日常提示词库</title>
  <link rel="stylesheet" href="./site.css">
  <script src="./copy.js" defer></script>
</head>
<body>
  <main class="container">
  <a class="back" href="./index.html">返回类别</a>
  <header class="intro">
    <h1>运行观察与性能</h1>
    <p>3 条提示词</p>
  </header>
  <article class="prompt">
  <div class="prompt-level">基础 · 单轮</div>
  <h2>确认应用为什么启动不起来</h2>
  <p>从环境、依赖和入口的状态入手。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：确认应用为什么启动不起来">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制：确认应用为什么启动不起来">复制</button>
  </div>
  <template>
    <pre class="prompt-body" data-full-prompt>运行入口、环境与最近变更：[填写]。命令及脱敏报错：[粘贴]。

从实际启动命令追踪主进程、配置来源与依赖可用性。按最小成本给出检查顺序，说明每项预期信号和失败后的方向。标出哪些结论来自实际日志，哪些需要进一步确认。保持现有环境状态，交付定位结果与下一步。</pre>
    
  </template>
</article>
<article class="prompt">
  <div class="prompt-level">进阶 · 多轮</div>
  <h2>先测量，再优化一条慢路径</h2>
  <p>用可比较的基线与复测判断优化是否有效。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：先测量，再优化一条慢路径">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制全套：先测量，再优化一条慢路径">复制全套</button>
  </div>
  <template>
    <pre data-full-prompt hidden>### 第 1 轮 · 定义基线

慢路径：[入口]。运行环境、代表性输入和指标目标：[填写]。设计可重复的测量，说明输入规模、预热、采样和指标口径。找可能使两次测量无法比较的变量。

### 第 2 轮 · 定位瓶颈

已有测量、日志或性能报告：[粘贴]。从指标追到最可能的瓶颈，提出可证伪假设和最小区分检查。只推荐当前证据支持的改动。

### 第 3 轮 · 用同口径复测

改动与复测结果：[填]。对照基线报告收益、波动和副作用。评估是否符合预设阈值，若缺证据，请列出用于决策的下一次测量。</pre><section class="prompt-round">
      <div class="round-header">
        <h3>第 1 轮 · 定义基线</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 1 轮 · 定义基线">复制本轮</button>
      </div>
      <pre class="prompt-body">慢路径：[入口]。运行环境、代表性输入和指标目标：[填写]。设计可重复的测量，说明输入规模、预热、采样和指标口径。找可能使两次测量无法比较的变量。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 2 轮 · 定位瓶颈</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 2 轮 · 定位瓶颈">复制本轮</button>
      </div>
      <pre class="prompt-body">已有测量、日志或性能报告：[粘贴]。从指标追到最可能的瓶颈，提出可证伪假设和最小区分检查。只推荐当前证据支持的改动。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 3 轮 · 用同口径复测</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 3 轮 · 用同口径复测">复制本轮</button>
      </div>
      <pre class="prompt-body">改动与复测结果：[填]。对照基线报告收益、波动和副作用。评估是否符合预设阈值，若缺证据，请列出用于决策的下一次测量。</pre>
    </section>
    
  </template>
</article>
<article class="prompt">
  <div class="prompt-level">高阶 · 综合运用</div>
  <h2>为关键业务路径设计观测</h2>
  <p>围绕用户体验给出可解释的指标、定位信息和告警。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：为关键业务路径设计观测">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制：为关键业务路径设计观测">复制</button>
  </div>
  <template>
    <pre class="prompt-body" data-full-prompt>关键请求路径：[描述]。现有日志、指标与监控范围：[材料]。用户能感知的失败标准：[填写]。

从用户可见延迟、错误、结果完整性中选最能说明问题的信号。为各信号给名义口径、采集点、维度和核查方式，控制标签粒度与日志中的敏感信息。写出正常基线与告警条件，以及收到告警后能查的第一项证据。区分目前能记录与需要新支持的指标。</pre>
    
  </template>
</article>
</main>
<dialog class="detail-dialog" aria-labelledby="detail-title">
  <div class="detail-panel">
    <header class="detail-header">
      <h2 id="detail-title"></h2>
      <form method="dialog"><button class="button" type="submit" autofocus>关闭</button></form>
    </header>
    <div class="detail-content"></div>
    <footer class="detail-footer">
      <p class="detail-status" role="status"></p>
      <button class="button copy" type="button" data-copy>复制提示词</button>
    </footer>
  </div>
</dialog>
<div class="toast" role="status"></div>
</body>
</html>
