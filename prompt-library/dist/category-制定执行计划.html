<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="按工作场景浏览和复制中文提示词。">
  <title>制定执行计划 · 日常提示词库</title>
  <link rel="stylesheet" href="./site.css">
  <script src="./copy.js" defer></script>
</head>
<body>
  <main class="container">
  <a class="back" href="./index.html">返回类别</a>
  <header class="intro">
    <h1>制定执行计划</h1>
    <p>3 条提示词</p>
  </header>
  <article class="prompt">
  <div class="prompt-level">基础 · 单轮</div>
  <h2>把目标拆成可以逐步验收的计划</h2>
  <p>适合一天内可以推进的任务计划。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：把目标拆成可以逐步验收的计划">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制：把目标拆成可以逐步验收的计划">复制</button>
  </div>
  <template>
    <pre class="prompt-body" data-full-prompt>目标：[结果]。现状：[可用资源和已完成项]。限制：[时间、范围、预算]。

给出最小可执行计划。每一步写“做什么 → 产物 → 如何验证”，先安排最快能排除关键未知的步骤。标注步骤依赖和停止位置，把能独立推进的事项单列。估计超过时间上限时，说明最小交付能覆盖哪些验收条件。</pre>
    
  </template>
</article>
<article class="prompt">
  <div class="prompt-level">进阶 · 多轮</div>
  <h2>三轮定出能执行也能中断的计划</h2>
  <p>适合资源、时间与完成标准尚未完全确定的任务。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：三轮定出能执行也能中断的计划">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制全套：三轮定出能执行也能中断的计划">复制全套</button>
  </div>
  <template>
    <pre data-full-prompt hidden>### 第 1 轮 · 明确约束

目标：[描述]。当前状态：[材料]。先澄清目标、范围、时间、人员或工具，提取已确定的边界，最多提出三个会改变计划的未知。此轮只做分析，等待我的取舍。

### 第 2 轮 · 排最小行动顺序

决定与可用资源：[填写]。将工作拆成可独立验证的小步。每步给出目标、输入、具体行动、验收、验证方法和所需人工判断。注明前置依赖，先安排验证核心风险的步骤，给出中断后从哪里继续。

### 第 3 轮 · 审查计划

请用以下完成标准检查上版计划：[填写]。逐项找出范围外工作、依赖缺口、超时和无法验收的步骤。将修订后的顺序与每步完成判据一并交付，按“通过／需确认”列出剩余决策。</pre><section class="prompt-round">
      <div class="round-header">
        <h3>第 1 轮 · 明确约束</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 1 轮 · 明确约束">复制本轮</button>
      </div>
      <pre class="prompt-body">目标：[描述]。当前状态：[材料]。先澄清目标、范围、时间、人员或工具，提取已确定的边界，最多提出三个会改变计划的未知。此轮只做分析，等待我的取舍。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 2 轮 · 排最小行动顺序</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 2 轮 · 排最小行动顺序">复制本轮</button>
      </div>
      <pre class="prompt-body">决定与可用资源：[填写]。将工作拆成可独立验证的小步。每步给出目标、输入、具体行动、验收、验证方法和所需人工判断。注明前置依赖，先安排验证核心风险的步骤，给出中断后从哪里继续。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 3 轮 · 审查计划</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 3 轮 · 审查计划">复制本轮</button>
      </div>
      <pre class="prompt-body">请用以下完成标准检查上版计划：[填写]。逐项找出范围外工作、依赖缺口、超时和无法验收的步骤。将修订后的顺序与每步完成判据一并交付，按“通过／需确认”列出剩余决策。</pre>
    </section>
    
  </template>
</article>
<article class="prompt">
  <div class="prompt-level">高阶 · 综合运用</div>
  <h2>先解决能推翻计划的未知</h2>
  <p>适合跨多日、涉及外部依赖或容易返工的任务。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：先解决能推翻计划的未知">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制：先解决能推翻计划的未知">复制</button>
  </div>
  <template>
    <pre class="prompt-body" data-full-prompt>目标：[描述]。工期、人员与依赖：[限制]。可能的失败：[列举]。

指出最可能改变总体方案的两项假设，分别给出最便宜的验证方式、证据阈值和不通过时的替代路径。把主方案拆成可停止的里程碑，每个包含交付物、验收、风险、结束判据和恢复需要的上下文。区分可并行工作和必须等待的决定。把最终日期、负责人等未经确认的信息标成建议。</pre>
    
  </template>
</article>
</main>
<dialog class="detail-dialog" aria-labelledby="detail-title">
  <div class="detail-panel">
    <header class="detail-header">
      <h2 id="detail-title"></h2>
      <form method="dialog"><button class="button" type="submit" autofocus>关闭</button></form>
    </header>
    <div class="detail-content"></div>
    <footer class="detail-footer">
      <p class="detail-status" role="status"></p>
      <button class="button copy" type="button" data-copy>复制提示词</button>
    </footer>
  </div>
</dialog>
<div class="toast" role="status"></div>
</body>
</html>
