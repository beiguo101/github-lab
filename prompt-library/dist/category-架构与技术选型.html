<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="按工作场景浏览和复制中文提示词。">
  <title>架构与技术选型 · 日常提示词库</title>
  <link rel="stylesheet" href="./site.css">
  <script src="./copy.js" defer></script>
</head>
<body>
  <main class="container">
  <a class="back" href="./index.html">返回类别</a>
  <header class="intro">
    <h1>架构与技术选型</h1>
    <p>3 条提示词</p>
  </header>
  <article class="prompt">
  <div class="prompt-level">基础 · 单轮</div>
  <h2>在约束内做一次技术选型</h2>
  <p>针对一个明确问题快速比较两到三种做法。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：在约束内做一次技术选型">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制：在约束内做一次技术选型">复制</button>
  </div>
  <template>
    <pre class="prompt-body" data-full-prompt>要解决的问题：[描述]。现有系统：[环境]。硬约束：[填写]。请比较可行的最少两种实现。

先说明每种做法对本任务提供什么，再按现有兼容性、实施成本、失败影响、长期维护比较。对证据未知的项标明验证方法。给出推荐、成立条件和最小验证实验。对未提供的信息写明假设。</pre>
    
  </template>
</article>
<article class="prompt">
  <div class="prompt-level">进阶 · 多轮</div>
  <h2>用小实验缩小架构选择</h2>
  <p>适合可行性靠现有证据无法确定的选型。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：用小实验缩小架构选择">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制全套：用小实验缩小架构选择">复制全套</button>
  </div>
  <template>
    <pre data-full-prompt hidden>### 第 1 轮 · 收敛判断维度

目标：[任务]。候选：[方案]。约束：[环境与预算]。找一项会改变推荐的关键差异，为每个候选定义相同输入、相同通过阈值和可重复的验证步骤。

### 第 2 轮 · 解释实测结果

结果与日志：[填写]。按前一轮的统一条件比较，标明读数来源、失败项及仍缺的证据。给出当前选择与下一次重新评估的触发条件。</pre><section class="prompt-round">
      <div class="round-header">
        <h3>第 1 轮 · 收敛判断维度</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 1 轮 · 收敛判断维度">复制本轮</button>
      </div>
      <pre class="prompt-body">目标：[任务]。候选：[方案]。约束：[环境与预算]。找一项会改变推荐的关键差异，为每个候选定义相同输入、相同通过阈值和可重复的验证步骤。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 2 轮 · 解释实测结果</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 2 轮 · 解释实测结果">复制本轮</button>
      </div>
      <pre class="prompt-body">结果与日志：[填写]。按前一轮的统一条件比较，标明读数来源、失败项及仍缺的证据。给出当前选择与下一次重新评估的触发条件。</pre>
    </section>
    
  </template>
</article>
<article class="prompt">
  <div class="prompt-level">高阶 · 综合运用</div>
  <h2>形成可复查的架构决定</h2>
  <p>保留替代方案、前提和将来推翻决定的证据。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：形成可复查的架构决定">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制：形成可复查的架构决定">复制</button>
  </div>
  <template>
    <pre class="prompt-body" data-full-prompt>待决定事项：[一句话]。约束、现状、实测：[填写]。

产出一页架构决策记录。描述当前痛点、候选、决定、为何这些证据足以支持它、哪些假设还没有验证。将执行顺序、兼容方式和回退成本列出。给出改变决定的触发条件与接手者能复查的文件、实验或数据。若关键选择缺证据，交付暂定决定及验证责任。</pre>
    
  </template>
</article>
</main>
<dialog class="detail-dialog" aria-labelledby="detail-title">
  <div class="detail-panel">
    <header class="detail-header">
      <h2 id="detail-title"></h2>
      <form method="dialog"><button class="button" type="submit" autofocus>关闭</button></form>
    </header>
    <div class="detail-content"></div>
    <footer class="detail-footer">
      <p class="detail-status" role="status"></p>
      <button class="button copy" type="button" data-copy>复制提示词</button>
    </footer>
  </div>
</dialog>
<div class="toast" role="status"></div>
</body>
</html>
