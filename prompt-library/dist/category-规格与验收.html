<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="按工作场景浏览和复制中文提示词。">
  <title>规格与验收 · 日常提示词库</title>
  <link rel="stylesheet" href="./site.css">
  <script src="./copy.js" defer></script>
</head>
<body>
  <main class="container">
  <a class="back" href="./index.html">返回类别</a>
  <header class="intro">
    <h1>规格与验收</h1>
    <p>3 条提示词</p>
  </header>
  <article class="prompt">
  <div class="prompt-level">基础 · 单轮</div>
  <h2>从用户故事写出验收条件</h2>
  <p>把抽象描述变成可观察的条件与动作。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：从用户故事写出验收条件">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制：从用户故事写出验收条件">复制</button>
  </div>
  <template>
    <pre class="prompt-body" data-full-prompt>需求：[原话]。现有界面或接口行为：[描述]。请给出一份验收清单。

以“给定…，当…，则…”描述正常路径、至少一个边界和一个失败恢复。每项指定用户可见结果或可比对数据。涉及旧调用方时加入兼容性用例。无法从材料确定的行为列为待确认，保留原单位、状态和业务术语。</pre>
    
  </template>
</article>
<article class="prompt">
  <div class="prompt-level">进阶 · 多轮</div>
  <h2>从规则到验收样例</h2>
  <p>分轮把业务例子、行为规则和验证方法对齐。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：从规则到验收样例">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制全套：从规则到验收样例">复制全套</button>
  </div>
  <template>
    <pre data-full-prompt hidden>### 第 1 轮 · 提取规则

材料：[需求、流程和业务例子]。按触发、输入、状态变化、输出提取规则。标出冲突和缺失条件。用一组输入输出例子显示需要我选择的分歧。

### 第 2 轮 · 确定验收

规则决定：[填写]。据此写主路径、边界、兼容与失败场景。每条包含输入例子、动作、可观察结果和验证手段。标出哪些由自动检查覆盖，哪些需要人参与。

### 第 3 轮 · 确认交付边界

请对照原始需求逐条核查上版验收。标记无对应需求的条目和没有验收覆盖的要求，给出最小修订。输出实施者可直接使用的规格与待确认问题。</pre><section class="prompt-round">
      <div class="round-header">
        <h3>第 1 轮 · 提取规则</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 1 轮 · 提取规则">复制本轮</button>
      </div>
      <pre class="prompt-body">材料：[需求、流程和业务例子]。按触发、输入、状态变化、输出提取规则。标出冲突和缺失条件。用一组输入输出例子显示需要我选择的分歧。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 2 轮 · 确定验收</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 2 轮 · 确定验收">复制本轮</button>
      </div>
      <pre class="prompt-body">规则决定：[填写]。据此写主路径、边界、兼容与失败场景。每条包含输入例子、动作、可观察结果和验证手段。标出哪些由自动检查覆盖，哪些需要人参与。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 3 轮 · 确认交付边界</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 3 轮 · 确认交付边界">复制本轮</button>
      </div>
      <pre class="prompt-body">请对照原始需求逐条核查上版验收。标记无对应需求的条目和没有验收覆盖的要求，给出最小修订。输出实施者可直接使用的规格与待确认问题。</pre>
    </section>
    
  </template>
</article>
<article class="prompt">
  <div class="prompt-level">高阶 · 综合运用</div>
  <h2>把复杂状态写成决策表</h2>
  <p>适合有状态流转、重试与历史数据的需求。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：把复杂状态写成决策表">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制：把复杂状态写成决策表">复制</button>
  </div>
  <template>
    <pre class="prompt-body" data-full-prompt>对象与状态：[列出]。入口与角色：[列出]。已确认规则：[填写]。

先写跨状态都成立的约束，再用决策表给出“起始状态、角色与事件、前提、允许的后继状态、可见结果”。对重复请求、并发和旧数据只按材料允许的范围检查。给每条关键转移一个可验证例子。指出规则冲突、无法到达的状态和待业务决定的缺口。</pre>
    
  </template>
</article>
</main>
<dialog class="detail-dialog" aria-labelledby="detail-title">
  <div class="detail-panel">
    <header class="detail-header">
      <h2 id="detail-title"></h2>
      <form method="dialog"><button class="button" type="submit" autofocus>关闭</button></form>
    </header>
    <div class="detail-content"></div>
    <footer class="detail-footer">
      <p class="detail-status" role="status"></p>
      <button class="button copy" type="button" data-copy>复制提示词</button>
    </footer>
  </div>
</dialog>
<div class="toast" role="status"></div>
</body>
</html>
