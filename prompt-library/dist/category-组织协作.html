  </div>
  <template>
    <pre data-full-prompt hidden>### 第 1 轮 · 核对新旧规则

### 第 2 轮 · 分派更新和验证

输入：[负责人确认结果、入口清单、获准修改范围]。为各入口分派责任人并定义正例、边界和旧条件的预期。回填实际更新版本及验证记录；需要人工配置或通知的步骤交相应负责人处理。

输入：[更新记录、验证结果、生效公告或登记]。核对生效日期、入口与证据能否互相回查。仍未更新或未验证的入口保留负责人和复查时间；完成项注明实际生效状态。</pre><section class="prompt-round">

</article>
<article class="prompt">
  <div class="prompt-level">进阶 · 多轮</div>
  <h2>在办事项交接</h2>
  <p>每个未完事项有接手人和继续处理需要的材料。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：在办事项交接">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制全套：在办事项交接">复制全套</button>
  </div>
  <template>
    <pre data-full-prompt hidden>### 第 1 轮 · 整理在办事项

输入：[工单、最近沟通、排班或交接范围]。逐项汇总现状、最近的已确认决定、下一步、截止时间和材料链接。冲突、失效链接、无权限材料单列。任务状态以可核验记录为准。

### 第 2 轮 · 与接手人逐项确认

输入：[拟接手人和确认回复]。形成可确认清单，要求接手人确认责任、下一步、时限与材料访问状态。将未确认或缺资料的事项退回给对应补齐人，并记录下次跟进。

### 第 3 轮 · 登记交接完成情况

输入：[逐项确认结果和补齐材料]。按事项标记已接手、待补资料或待确认，注明接手人、时间和可用材料。只有在办事项均有人承接且具备继续处理条件时，才生成整批交接完成记录。</pre><section class="prompt-round">
      <div class="round-header">
        <h3>第 1 轮 · 整理在办事项</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 1 轮 · 整理在办事项">复制本轮</button>
      </div>
      <pre class="prompt-body">输入：[工单、最近沟通、排班或交接范围]。逐项汇总现状、最近的已确认决定、下一步、截止时间和材料链接。冲突、失效链接、无权限材料单列。任务状态以可核验记录为准。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 2 轮 · 与接手人逐项确认</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 2 轮 · 与接手人逐项确认">复制本轮</button>
      </div>
      <pre class="prompt-body">输入：[拟接手人和确认回复]。形成可确认清单，要求接手人确认责任、下一步、时限与材料访问状态。将未确认或缺资料的事项退回给对应补齐人，并记录下次跟进。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 3 轮 · 登记交接完成情况</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 3 轮 · 登记交接完成情况">复制本轮</button>
      </div>
      <pre class="prompt-body">输入：[逐项确认结果和补齐材料]。按事项标记已接手、待补资料或待确认，注明接手人、时间和可用材料。只有在办事项均有人承接且具备继续处理条件时，才生成整批交接完成记录。</pre>
    </section>
    
  </template>
</article>
<article class="prompt">
  <div class="prompt-level">进阶 · 多轮</div>
  <h2>把重复例外变成处理规则</h2>
  <p>从已关闭案例提炼规则与反例，再用历史样本重放。</p>
  <div class="prompt-actions">
    <button class="button" type="button" data-detail aria-label="查看详情：把重复例外变成处理规则">查看详情</button>
    <button class="button copy" type="button" data-copy aria-label="复制全套：把重复例外变成处理规则">复制全套</button>
  </div>
  <template>
    <pre data-full-prompt hidden>### 第 1 轮 · 抽取共同条件和反例

输入：[同类已关闭案例、原处理证据、已知反例]。逐项提取触发条件、处理动作、结果及需要人工判断的变量。提出一条候选规则，标明样本范围、证据缺口和至少一个不适用的反例。

### 第 2 轮 · 确认规则与重放样本

输入：[负责人认可的候选规则、通过条件和历史样本]。明确适用条件、材料要求、动作与人工转交条件。准备覆盖已知正例、反例及边界的重放表，记录预期结果与实际归类。

### 第 3 轮 · 依据重放结果发布规则

输入：[重放结果和负责人决定]。交付确认后的规则说明、适用样例、反例、人工判断条件、责任人和生效版本。出现误判时记录具体样本与待修订内容，规则保持候选或按负责人决定缩小适用范围。</pre><section class="prompt-round">
      <div class="round-header">
        <h3>第 1 轮 · 抽取共同条件和反例</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 1 轮 · 抽取共同条件和反例">复制本轮</button>
      </div>
      <pre class="prompt-body">输入：[同类已关闭案例、原处理证据、已知反例]。逐项提取触发条件、处理动作、结果及需要人工判断的变量。提出一条候选规则，标明样本范围、证据缺口和至少一个不适用的反例。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 2 轮 · 确认规则与重放样本</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 2 轮 · 确认规则与重放样本">复制本轮</button>
      </div>
      <pre class="prompt-body">输入：[负责人认可的候选规则、通过条件和历史样本]。明确适用条件、材料要求、动作与人工转交条件。准备覆盖已知正例、反例及边界的重放表，记录预期结果与实际归类。</pre>
    </section>
<section class="prompt-round">
      <div class="round-header">
        <h3>第 3 轮 · 依据重放结果发布规则</h3>
        <button class="button copy" type="button" data-copy="round" aria-label="复制第 3 轮 · 依据重放结果发布规则">复制本轮</button>
      </div>
      <pre class="prompt-body">输入：[重放结果和负责人决定]。交付确认后的规则说明、适用样例、反例、人工判断条件、责任人和生效版本。出现误判时记录具体样本与待修订内容，规则保持候选或按负责人决定缩小适用范围。</pre>
    </section>
    
  </template>
</article>
